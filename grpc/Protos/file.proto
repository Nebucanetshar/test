syntax = "proto3";

option csharp_namespace = "grpc";
import "google/api/annotations.proto";

package greet;

service Counter{

	rpc StartCounter(CounterRequest) returns (stream CounterResponse)
	{
		option (google.api.http)={
			post:"/v1/greet"
			body:"*"
		};
	}
}

message CounterRequest{
	int32 start =1;
}

message CounterResponse{
	int32 count =1;

}